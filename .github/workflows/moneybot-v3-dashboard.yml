name: Moneybot V3 staging dashboard safety
on:
  push:
    branches: [moneybot-v3-research]
    paths:
      - 'Moneybot_V3/**'
      - '.github/workflows/moneybot-v3-dashboard.yml'
  workflow_dispatch:
    inputs:
      deployed_revision:
        description: 'Exact 40-character V3 staging commit SHA to verify after deployment (leave blank for local-only tests)'
        required: false
        type: string
jobs:
  dashboard-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install V3-only runtime dependencies
        run: python -m pip install -r Moneybot_V3/requirements.txt
      - name: Compile V3 source
        run: python -m compileall -q Moneybot_V3
      - name: Validate embedded dashboard JavaScript syntax with Node
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from paper_status_server import _HTML

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.inside = False
                  self.parts = []
              def handle_starttag(self, tag, attrs):
                  if tag == "script":
                      self.inside = True
              def handle_endtag(self, tag):
                  if tag == "script":
                      self.inside = False
              def handle_data(self, data):
                  if self.inside:
                      self.parts.append(data)

          parser = Scripts()
          parser.feed(_HTML)
          assert parser.parts, "Dashboard JavaScript is missing"
          Path("/tmp/v3-dashboard.js").write_text("\n".join(parser.parts))
          PY
          node --check /tmp/v3-dashboard.js
        env:
          PYTHONPATH: Moneybot_V3
      - name: Start read-only dashboard and test actual HTTP behavior
        shell: bash
        run: |
          set -euo pipefail
          export PORT=18765
          python Moneybot_V3/paper_status_server.py > /tmp/v3-dashboard.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat /tmp/v3-dashboard.log' EXIT
          for i in {1..30}; do
            if curl --silent --fail http://127.0.0.1:18765/healthz >/dev/null; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then exit 1; fi
            sleep 1
          done
          python Moneybot_V3/smoke_staging.py http://127.0.0.1:18765
      - name: Exercise real Chromium dashboard safety and refresh behavior
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
          export PORT=18765
          python Moneybot_V3/paper_status_server.py > /tmp/v3-browser.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat /tmp/v3-browser.log' EXIT
          for i in {1..30}; do
            if curl --silent --fail http://127.0.0.1:18765/healthz >/dev/null; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then exit 1; fi
            sleep 1
          done
          node Moneybot_V3/smoke_dashboard_browser.cjs
      - name: Verify deployed V3 staging HTTP safety and exact revision (manual only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deployed_revision != '' }}
        timeout-minutes: 5
        env:
          EXPECTED_REVISION: ${{ inputs.deployed_revision }}
        run: python Moneybot_V3/smoke_staging.py https://moneybot-v3-staging.onrender.com --revision "$EXPECTED_REVISION"
