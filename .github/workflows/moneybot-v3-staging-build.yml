name: Moneybot V3 staging build verification
on:
  push:
    branches: [moneybot-v3-research]
    paths:
      - 'Moneybot_V3/**'
      - '.github/workflows/moneybot-v3-staging-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-v3-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and verify isolated staging dependencies
        run: bash Moneybot_V3/render-build.sh
      # render-build.sh already imports the server via its guarded package path.
      # Avoid a second importlib execution that lacks normal module registration.
