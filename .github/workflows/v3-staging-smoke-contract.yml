name: V3 staging smoke contract tests
on:
  push:
    branches: [moneybot-v3-research]
    paths:
      - 'Moneybot_V3/staging_smoke.py'
      - 'Moneybot_V3/tests/test_staging_smoke_contract.py'
      - 'Moneybot_V3/tests/test_staging_revision_contract.py'
      - '.github/workflows/v3-staging-smoke-contract.yml'
  workflow_dispatch:
jobs:
  offline-contract:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run staging smoke contract regression tests
        run: python -m unittest discover -s Moneybot_V3/tests -p 'test_staging_*contract.py' -v
