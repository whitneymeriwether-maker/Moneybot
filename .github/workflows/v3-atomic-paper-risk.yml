name: V3 atomic paper risk
on:
  push:
    branches: [moneybot-v3-research]
    paths:
      - 'Moneybot_V3/paper_ledger.py'
      - 'Moneybot_V3/tests/test_atomic_paper_risk.py'
      - '.github/workflows/v3-atomic-paper-risk.yml'
  workflow_dispatch:
jobs:
  atomic-paper-risk:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Atomic risk regression
        run: python -m unittest discover -s Moneybot_V3/tests -p 'test_atomic_paper_risk.py' -v
