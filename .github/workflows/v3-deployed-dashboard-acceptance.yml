name: V3 deployed dashboard acceptance
on:
  workflow_dispatch:
  push:
    branches: [moneybot-v3-research]
    paths: ['.github/workflows/v3-deployed-dashboard-acceptance.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install playwright==1.51.0
          python -m playwright install --with-deps chromium
      - name: Verify actual deployed staging in Chromium
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import re
          base = "https://moneybot-v3-staging.onrender.com"
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              errors = []
              page.on("pageerror", lambda error: errors.append(str(error)))
              response = page.goto(base, timeout=120000)
              assert response and response.ok, "Dashboard HTTP failure"
              page.get_by_text("NOT ACTIVATED", exact=False).first.wait_for(timeout=30000)
              body = page.locator("body").inner_text()
              for section in ("system health", "account", "risk", "performance"):
                  assert section in body.lower(), f"Missing section: {section}"
              health = page.request.get(base + "/healthz", timeout=30000)
              assert health.ok, "Liveness failure"
              ready = page.request.get(base + "/readyz", timeout=30000)
              assert ready.status in (200, 503), "Unexpected readiness response"
              assert not errors, errors
              page.screenshot(path="v3-dashboard.png", full_page=True)
              print("Deployed dashboard browser and endpoint smoke passed; trading readiness not certified.")
              browser.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-deployed-dashboard
          path: v3-dashboard.png
          if-no-files-found: ignore
