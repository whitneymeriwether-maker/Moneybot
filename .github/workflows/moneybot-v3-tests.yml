
name: Moneybot V3 Tests

on:
  workflow_dispatch:
  push:
    branches:
      - moneybot-v3-research
    paths:
      - 'Moneybot_V3/**'
      - '.github/workflows/moneybot-v3-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run V3 tests
        working-directory: Moneybot_V3
        run: python -m pytest -q
