
name: Moneybot V3 Tests

on:
  workflow_dispatch:
  push:
    branches:
      - moneybot-v3-research
    paths:
      - 'Moneybot_V3/**'
      - '.github/workflows/moneybot-v3-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest
        run: python -m pip install pytest

      - name: Compile all V3 Python sources
        working-directory: Moneybot_V3
        run: python -m compileall -q .

      - name: Syntax-check browser dashboard JavaScript
        working-directory: Moneybot_V3
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          from paper_status_server import _HTML

          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", _HTML, re.DOTALL)
          if len(scripts) != 1 or len(re.findall(r"<script\b", _HTML, re.IGNORECASE)) != 1:
              raise SystemExit("Expected exactly one inline dashboard script and no external scripts")
          Path("/tmp/moneybot-v3-dashboard.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/moneybot-v3-dashboard.js

      - name: Run V3 tests
        working-directory: Moneybot_V3
        run: python -m pytest -q
