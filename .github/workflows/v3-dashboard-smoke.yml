name: V3 dashboard HTTP smoke
on:
  push:
    branches: [moneybot-v3-research]
    paths:
      - 'Moneybot_V3/**'
      - '.github/workflows/v3-dashboard-smoke.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and verify V3 isolated runtime dependencies
        run: |
          python -m pip install -r Moneybot_V3/requirements.txt
          python -c 'import psycopg; print("V3 PostgreSQL driver import OK")'
      - name: Compile V3 status and smoke scripts
        run: python -m compileall -q Moneybot_V3
      - name: Validate dashboard browser JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          page = Path('Moneybot_V3/paper_status_server.py').read_text()
          match = re.search(r'<script>(.*?)</script>', page, re.DOTALL)
          if not match:
              raise SystemExit('Dashboard inline JavaScript not found')
          Path('/tmp/moneybot-v3-dashboard.js').write_text(match.group(1))
          PY
          node --check /tmp/moneybot-v3-dashboard.js
      - name: Launch isolated read-only status service
        run: |
          PORT=18765 python Moneybot_V3/paper_status_server.py > /tmp/v3-dashboard.log 2>&1 &
          echo $! > /tmp/v3-dashboard.pid
      - name: Probe actual HTTP endpoints and write rejection
        run: |
          python - <<'PY'
          import time, urllib.request
          for attempt in range(30):
              try:
                  urllib.request.urlopen('http://127.0.0.1:18765/healthz', timeout=1)
                  break
              except Exception:
                  time.sleep(0.3)
          else:
              raise SystemExit('Local dashboard failed to start')
          PY
          python Moneybot_V3/smoke_dashboard.py http://127.0.0.1:18765
      - name: Install isolated Chromium browser test dependency
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Exercise real browser dashboard and refresh
        run: node Moneybot_V3/smoke_dashboard_browser.cjs
      - name: Show server logs on failure
        if: failure()
        run: cat /tmp/v3-dashboard.log
