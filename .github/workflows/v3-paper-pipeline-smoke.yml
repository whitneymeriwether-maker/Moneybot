name: V3 paper pipeline integration smoke
on:
  push:
    branches: [moneybot-v3-research]
    paths:
      - 'Moneybot_V3/paper_ledger.py'
      - 'Moneybot_V3/paper_decision_gate.py'
      - 'Moneybot_V3/verified_market_quote.py'
      - 'Moneybot_V3/research_cycle_claims.py'
      - 'Moneybot_V3/tests/test_paper_pipeline_contract.py'
      - '.github/workflows/v3-paper-pipeline-smoke.yml'
  workflow_dispatch:
jobs:
  offline-integration:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Synthetic pipeline contract (no network or broker credentials)
        run: python -m unittest discover -s Moneybot_V3/tests -p test_paper_pipeline_contract.py -v
