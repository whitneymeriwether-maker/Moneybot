
name: Moneybot V3 Research Scan

on:
  push:
    branches:
      - moneybot-v3-research
    paths:
      - .github/workflows/moneybot-v3-fmp-test.yml

  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Check out V3 research branch
        uses: actions/checkout@v4
        with:
          ref: moneybot-v3-research

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run 20-stock research scan
        working-directory: Moneybot_V3
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: |
          python backtesting/run_research_scan.py
