name: Moneybot V3 isolated tests
on:
  push:
    branches: [moneybot-v3-research]
    paths:
      - 'Moneybot_V3/**'
      - '.github/workflows/moneybot-v3-isolated-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper-safety-and-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Moneybot_V3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Compile staging modules
        run: python -m compileall -q .
      - name: Run isolated V3 tests
        env:
          PYTHONPATH: .
          MONEYBOT_V3_ACTIVATION: 'false'
        run: python -m pytest -q tests
